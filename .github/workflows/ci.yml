name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Il build non interroga il database (tutte le pagine sono dinamiche), ma
      # Prisma Client valida DATABASE_URL alla costruzione: basta un valore fittizio.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      AUTH_SECRET: ci-only-not-a-real-secret

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall esegue gia "prisma generate"
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: WhatsApp webhook tests
        run: npm run test:whatsapp

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
